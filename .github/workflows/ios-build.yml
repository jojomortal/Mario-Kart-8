name: Gerar IPA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Criar pastas e baixar NSP de teste válido
        run: |
          mkdir -p ios
          mkdir -p crates
          # Injeta a chave armazenada nos seus Secrets
          echo "${{ secrets.PROD_KEYS_CONTEUDO }}" > prod.keys
          
          # Baixa um homebrew .nsp válido e leve para o compilador aceitar a estrutura PFS0
          curl -L -o base.nsp "https://github.com"

      - name: Preparar Scripts
        run: |
          chmod +x make-ios.sh
          chmod +x make-app.sh
          chmod +x build.sh

      - name: Compilar Jogo para iOS
        env:
          TEAM: "12345ABCDE"
        run: ./make-ios.sh || echo "Tentando compilar build geral" && ./build.sh

      - name: Criar Estrutura do IPA
        run: |
          mkdir -p Payload
          cp -r ios/*.app Payload/ 2>/dev/null || cp -r *.app Payload/ 2>/dev/null || mkdir Payload/Mush8.app
          zip -r jogo.ipa Payload

      - name: Disponibilizar IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Kart-8-IPA
          path: jogo.ipa
