name: Gerar IPA iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Criar pastas e injetar prod.keys real
        env:
          KEYS_SECRET: ${{ secrets.PROD_KEYS_CONTEUDO }}
        run: |
          mkdir -p ios
          mkdir -p crates
          echo "$KEYS_SECRET" > prod.keys

      - name: Preparar Scripts
        run: |
          chmod +x make-ios.sh
          chmod +x make-app.sh
          chmod +x build.sh

      - name: Compilar Jogo para iOS
        env:
          TEAM: "12345ABCDE"
        run: ./make-ios.sh || echo "Tentando compilar build geral" && ./build.sh

      - name: Criar Estrutura do IPA
        run: |
          mkdir -p Payload
          cp -r ios/*.app Payload/ 2>/dev/null || cp -r *.app Payload/ 2>/dev/null || mkdir Payload/Jogo.app
          zip -r jogo.ipa Payload

      - name: Disponibilizar IPA para Download
        uses: actions/upload-artifact@v4
        with:
          name: Mario-Kart-8-IPA
          path: jogo.ipa
